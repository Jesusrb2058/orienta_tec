<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Información de la aplicación -->
  <meta
    name="description"
    content="Orienta Tec - Plataforma de orientación estudiantil."
  >

  <!-- Configuración para dispositivos móviles -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Orienta Tec"
  >

  <!-- Icono para iPhone/iPad -->
  <link
    rel="apple-touch-icon"
    href="icons/icono_chico.png"
  >

  <!-- Icono del navegador -->
  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <!-- Color principal de la aplicación -->
  <meta name="theme-color" content="#FFFFFF">

  <!-- Nombre de la aplicación -->
  <title>Orienta Tec</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">


  <!-- Pantalla de carga de Flutter -->
  <style id="splash-screen-style">

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;

      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;

      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

  </style>


  <!-- Control de pantalla de carga -->
  <script id="splash-screen-script">

    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();

      document.body.style.background = "transparent";
    }

  </script>

</head>


<body>

  <!-- Pantalla de carga -->
  <picture id="splash">

    <source
      srcset="
        splash/img/light-1x.png 1x,
        splash/img/light-2x.png 2x,
        splash/img/light-3x.png 3x,
        splash/img/light-4x.png 4x
      "
      media="(prefers-color-scheme: light)"
    >

    <source
      srcset="
        splash/img/dark-1x.png 1x,
        splash/img/dark-2x.png 2x,
        splash/img/dark-3x.png 3x,
        splash/img/dark-4x.png 4x
      "
      media="(prefers-color-scheme: dark)"
    >

    <img
      class="center"
      aria-hidden="true"
      src="splash/img/light-1x.png"
      alt=""
    >

  </picture>


  <!-- Flutter -->
  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
